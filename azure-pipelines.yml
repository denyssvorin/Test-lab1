# Android
# Build your Android project with Gradle.
# Add steps that test, sign, and distribute the APK, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/android

trigger:
- main

pool:
  vmImage: 'macos-latest'

steps:
# 1) Встановлюємо JDK 17
- task: JavaToolInstaller@0
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

# 2) Дозвіл на виконання Gradle
- script: chmod +x gradlew
  displayName: 'Grant execute permission for gradlew'

# 3) Збірка проєкту
- script: ./gradlew assembleDebug
  displayName: 'Build Debug APK'

# 4) Збереження артефактів (APK)
- task: PublishBuildArtifacts@1
  inputs:
    pathtoPublish: 'app/build/outputs/apk/debug'
    artifactName: 'apk-debug'
    publishLocation: 'Container'
